  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Training Partner</title>
    <meta name="description" content="Your AI coach for CrossFit and hybrid training." />
    <meta name="theme-color" content="#0E0F12" />
    <meta name="color-scheme" content="dark" />

    <!-- Add to Home Screen on iPhone: opens full screen like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  </body>
